services:

  mysql:
    image: mysql:8.4
    container_name: vehiculos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cambiar-esta-clave}
      MYSQL_DATABASE: vehiculos
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - vehiculos-net

  ms-vehiculos:
    # En el pipeline IMAGE apunta a la imagen publicada en GHCR con el SHA del commit.
    # En local, si IMAGE no existe, se construye desde el Dockerfile.
    image: ${IMAGE:-ms-vehiculos:local}
    build: .
    container_name: ms-vehiculos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vehiculos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-cambiar-esta-clave}
      SERVER_PORT: 9004
    ports:
      - "9004:9004"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9004/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - vehiculos-net

volumes:
  mysql_data:

networks:
  vehiculos-net:
