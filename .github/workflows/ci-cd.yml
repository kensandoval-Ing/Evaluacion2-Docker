name: CI/CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1) Compilación y pruebas unitarias (IE2)
  # ---------------------------------------------------------------
  test:
    name: Build y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas (JUnit + JaCoCo)
        run: mvn -B clean verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ---------------------------------------------------------------
  # 2) Análisis de seguridad con Snyk (IE3)
  #    Si encuentra vulnerabilidades HIGH o superiores, el job falla
  #    y se bloquean los jobs siguientes (imagen y despliegue).
  # ---------------------------------------------------------------
    security:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: snyk/actions/setup@master

      - name: Snyk - dependencias Maven
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      - name: Snyk Code - análisis estático del código
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

  # ---------------------------------------------------------------
  # 3) Construcción y publicación de la imagen Docker (IE1)
  #    Solo en push a main. Se etiqueta con el SHA del commit
  #    para garantizar la trazabilidad (IE4).
  # ---------------------------------------------------------------
  docker:
    name: Build y push de imagen Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nombre de imagen (en minúsculas)
        id: vars
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 4) Despliegue automático en entorno simulado con Docker Compose (IE4, IE5)
  #    Levanta MySQL + microservicio y valida con una prueba de humo.
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado (Docker Compose)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: simulado
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar el stack con la imagen del commit
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Desplegando $IMAGE (commit ${GITHUB_SHA})"
          docker compose pull ms-vehiculos
          docker compose up -d --no-build

      - name: Prueba de humo
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9004/ ; then
              echo; echo "Servicio respondiendo correctamente"; exit 0
            fi
            echo "Esperando al servicio... ($i/30)"; sleep 5
          done
          echo "El servicio no respondió"; docker compose logs; exit 1

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "### Despliegue"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Imagen: \`${{ needs.docker.outputs.image }}\`"
            echo "- Autor: ${{ github.actor }}"
            echo "- Ejecución: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
